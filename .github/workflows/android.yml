# RigDesk's GUI for Android (arm64): the Flutter viewer with the agent panel, for the operator's phone on the tailnet.
# Derived from upstream's flutter-build.yml (v1.5.1) generate-bridge and build-rustdesk-android (aarch64 only), with
# the vcpkg fetch and the public-host check of linux.yml. The release APK is debug-signed, as upstream's is by default.
name: android

on:
  push:
    branches: [main, "s*"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_NDK_VERSION: "3.1.2"
  NDK_VERSION: "r28c"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:

  bridge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge
      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-${{ env.FLUTTER_RUST_BRIDGE_VERSION }}-${{ env.CARGO_EXPAND_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true
      - name: Install flutter rust bridge
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          [ -x ~/.cargo/bin/flutter_rust_bridge_codegen ] || cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # extended_text 14 needs a newer Dart than the bridge's Flutter.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd
      - name: Generate the bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart

  android-arm64:
    needs: [bridge]
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib libc6-dev libclang-dev llvm-dev \
            nasm ninja-build openjdk-17-jdk-headless pkg-config python3 unzip wget
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Patch Flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
      # As in linux.yml: the vcpkg tool and every download vcpkg makes go through .github/ci/fetch_asset.py.
      - name: vcpkg at the pinned commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          cd "$HOME/vcpkg"
          git checkout -q "$VCPKG_COMMIT_ID"
          tag=$(sed -n 's/^VCPKG_TOOL_RELEASE_TAG=//p' scripts/vcpkg-tool-metadata.txt | tr -d '\r')
          if python3 "$GITHUB_WORKSPACE/.github/ci/fetch_asset.py" "https://github.com/microsoft/vcpkg-tool/releases/download/$tag/vcpkg-glibc" vcpkg; then
            chmod +x vcpkg
          else
            ./bootstrap-vcpkg.sh -disableMetrics
          fi
          ./vcpkg version | head -1
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
      - name: Install vcpkg dependencies
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          X_VCPKG_ASSET_SOURCES: clear;x-script,python3 ${{ github.workspace }}/.github/ci/fetch_asset.py {url} {dst}
          GH_TOKEN: ${{ github.token }}
        run: |
          for try in 1 2 3 4 5; do
            if ./flutter/build_android_deps.sh arm64-v8a; then
              exit 0
            fi
            [ $try -lt 5 ] && { echo "vcpkg install failed (attempt $try); retrying"; sleep $((60 * try)); }
          done
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r log; do echo "$log:"; cat "$log"; done
          exit 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge
          path: ./
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android
          components: "rustfmt"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: android
          key: aarch64-linux-android
      - name: Build the library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
      - name: Build the APK
        id: build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # No release key: sign with the debug key, as upstream does without one.
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          jni=./flutter/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p $jni
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so $jni/
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so $jni/librustdesk.so
          cd flutter
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../rigdesk-android-arm64.apk
      - name: Identity
        run: |
          aapt=$(ls -d /usr/local/lib/android/sdk/build-tools/*/ | tail -n 1)aapt
          $aapt dump badging rigdesk-android-arm64.apk | grep -E "^package:|^application-label:|native-code"
      - name: No public RustDesk servers or keys in the build
        run: |
          mkdir apk && unzip -q rigdesk-android-arm64.apk -d apk
          found=0
          for needle in rs-ny.rustdesk.com api.rustdesk.com admin.rustdesk.com relay.rustdesk.com \
                        OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw= 5Qbwsde3unUcJBtrx9ZkvUmwFNoExHzpryHuPUdqlWM=; do
            hits=$(grep -rlaF "$needle" apk target/aarch64-linux-android/release/liblibrustdesk.so || true)
            if [ -n "$hits" ]; then echo "::error::$needle found in: $hits"; found=1; fi
          done
          exit $found
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: rigdesk-android-arm64
          path: rigdesk-android-arm64.apk
