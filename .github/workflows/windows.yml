# RigDesk: one Windows x64 build. Derived from upstream's flutter-build.yml (v1.5.1), cut to the one target we ship.
name: windows

# Parked with the dedicated Windows client (plan p-97f7, 2026-11-08): run by hand until it resumes.
on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_TRIPLET: x64-windows-static
  TARGET: x86_64-pc-windows-msvc

jobs:
  bridge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge
      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-${{ env.FLUTTER_RUST_BRIDGE_VERSION }}-${{ env.CARGO_EXPAND_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true
      - name: Install flutter rust bridge
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          [ -x ~/.cargo/bin/flutter_rust_bridge_codegen ] || cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # extended_text 14 needs a newer Dart than the bridge's Flutter.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd
      - name: Generate the bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart

  windows-x64:
    needs: [bridge]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge
          path: ./
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        id: llvm
        continue-on-error: true
        with:
          version: ${{ env.LLVM_VERSION }}
      # GitHub release downloads sometimes answer 504 for minutes; the runner image ships its own LLVM for bindgen.
      - name: Fall back to the runner's LLVM
        if: steps.llvm.outcome == 'failure'
        shell: bash
        run: |
          test -f "/c/Program Files/LLVM/bin/libclang.dll"
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
      # https://github.com/flutter/flutter/issues/155685: upstream builds Windows on its own engine build.
      - name: Replace the Flutter engine with RustDesk's
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flutter precache --windows
          python .github/ci/fetch_asset.py https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip windows-x64-release.zip
          if ($LASTEXITCODE -ne 0) { throw 'engine download failed' }
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/
      - name: Patch Flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}
          components: "rustfmt"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022
      # GitHub's release download pages sometimes answer 504 for hours while its API serves the same assets, so the
      # vcpkg tool and every download vcpkg makes go through .github/ci/fetch_asset.py.
      - name: vcpkg at the pinned commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd /c/vcpkg
          git rev-parse -q --verify "$VCPKG_COMMIT_ID^{commit}" >/dev/null || git fetch -q origin "$VCPKG_COMMIT_ID"
          git checkout -q -f "$VCPKG_COMMIT_ID"
          tag=$(sed -n 's/^VCPKG_TOOL_RELEASE_TAG=//p' scripts/vcpkg-tool-metadata.txt | tr -d '\r')
          if python "$GITHUB_WORKSPACE/.github/ci/fetch_asset.py" "https://github.com/microsoft/vcpkg-tool/releases/download/$tag/vcpkg.exe" vcpkg.new.exe; then
            mv -f vcpkg.new.exe vcpkg.exe
          else
            echo "::warning::vcpkg tool $tag unavailable; using the runner image's"
          fi
          ./vcpkg.exe version | head -1
          echo 'VCPKG_ROOT=C:\vcpkg' >> "$GITHUB_ENV"
      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
          X_VCPKG_ASSET_SOURCES: clear;x-script,python ${{ github.workspace }}/.github/ci/fetch_asset.py {url} {dst}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Tool and source downloads come from GitHub releases, which sometimes answer 504 for minutes; finished
          # downloads stay in vcpkg's download cache, so each attempt picks up where the last one stopped.
          for try in 1 2 3 4 5; do
            if $VCPKG_ROOT/vcpkg install --triplet $VCPKG_TRIPLET --x-install-root="$VCPKG_ROOT/installed"; then
              exit 0
            fi
            [ $try -lt 5 ] && { echo "vcpkg install failed (attempt $try); retrying"; sleep $((60 * try)); }
          done
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r log; do echo "$log:"; cat "$log"; done
          exit 1
      - name: Build
        id: build
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rigdesk
          # The installer runs "<Program Files>\RigDesk\RigDesk.exe" (app name + .exe) after copying this folder;
          # upstream's rustdesk.exe matches RustDesk.exe only because Windows ignores case.
          mv ./rigdesk/rustdesk.exe ./rigdesk/RigDesk.exe
      - name: Version
        shell: powershell
        run: |
          $v = (& ".\rigdesk\RigDesk.exe" --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "--version exited with $LASTEXITCODE" }
          Write-Host "version: $v"
      - name: No public RustDesk servers or keys in the build
        shell: bash
        run: |
          found=0
          for needle in rs-ny.rustdesk.com api.rustdesk.com admin.rustdesk.com relay.rustdesk.com \
                        OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw= 5Qbwsde3unUcJBtrx9ZkvUmwFNoExHzpryHuPUdqlWM=; do
            hits=$(grep -rlaF "$needle" rigdesk || true)
            if [ -n "$hits" ]; then echo "::error::$needle found in: $hits"; found=1; fi
          done
          exit $found
      - name: Agent API smoke test against Notepad
        timeout-minutes: 10
        shell: powershell
        run: .\.github\smoke\agent.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: agent-smoke-evidence
          path: ${{ runner.temp }}/agent-smoke
          if-no-files-found: ignore
      - name: Installer smoke test (service, secrets, firewall, agent API)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        shell: powershell
        run: .\.github\smoke\install.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: rigdesk-windows-x64
          path: rigdesk
      - name: Agent unit tests (API crate, viewer share link and note baking)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          cargo test -p rigdesk-agent --locked
          cd flutter && flutter test test/agent_share_test.dart

  # A tag v* publishes the package, the install script pinned to it, and their checksums.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-x64
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rigdesk-windows-x64
          path: rigdesk
      - name: Package and pin
        run: .github/release/package.sh "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/rigdesk-windows-x64.zip out/install.ps1 out/SHA256SUMS \
            --title "RigDesk $GITHUB_REF_NAME" --notes-file out/NOTES.md
